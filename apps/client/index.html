<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#1b1b2f" />
    <title>Bombtopia</title>
    <style>
      :root {
        --bg: #1b1b2f;
        --panel: #26264a;
        --text: #f5f5f5;
        --muted: #a9a9c8;
        --accent: #ffd23f;
        --danger: #ff6b6b;
      }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); overflow: hidden; font-family: system-ui, sans-serif; }
      #app { width: 100%; height: 100%; display: grid; place-items: center; }
      canvas { image-rendering: pixelated; }
      #ui { position: fixed; inset: 0; display: grid; place-items: center; pointer-events: none; padding: 16px; z-index: 2; }
      .panel { pointer-events: auto; background: var(--panel); border: 3px solid #000; box-shadow: 0 6px 0 #000; border-radius: 12px; padding: 20px; width: min(340px, 100%); display: grid; gap: 10px; }
      .panel[hidden] { display: none; }
      .panel h1 { margin: 0 0 6px; text-align: center; color: var(--accent); font-size: 32px; letter-spacing: 1px; text-shadow: 3px 3px 0 #000; }
      .panel h2 { margin: 0; font-size: 18px; }
      .row { display: flex; gap: 8px; align-items: center; }
      .row > input { flex: 1; min-width: 0; }
      input, button { font: inherit; font-size: 16px; border-radius: 8px; border: 2px solid #000; padding: 10px 12px; }
      input { background: #fff; color: #111; }
      button { background: #e8e8f4; color: #111; cursor: pointer; font-weight: 600; }
      button.primary { background: var(--accent); }
      button:disabled { opacity: 0.5; cursor: default; }
      button[hidden] { display: none; }
      hr { border: 0; border-top: 1px solid #ffffff22; width: 100%; margin: 4px 0; }
      code { flex: 1; background: #00000044; padding: 10px; border-radius: 8px; font-size: 18px; letter-spacing: 1px; user-select: all; }
      .members { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
      .members li { display: flex; justify-content: space-between; gap: 8px; background: #00000033; padding: 8px 10px; border-radius: 8px; }
      .members li.me { outline: 2px solid var(--accent); }
      .wins { color: var(--muted); white-space: nowrap; }
      .error { color: var(--danger); margin: 0; min-height: 1em; }
      .hint { color: var(--muted); font-size: 13px; margin: 0; text-align: center; }
      .touch { position: fixed; inset: 0; z-index: 1; display: flex; touch-action: none; user-select: none; -webkit-user-select: none; }
      .touch[hidden] { display: none; }
      .stick-zone { flex: 1; position: relative; }
      .knob { position: fixed; width: 56px; height: 56px; margin: -28px 0 0 -28px; border-radius: 50%; background: #ffffff55; border: 3px solid #ffffffaa; pointer-events: none; }
      .knob[hidden] { display: none; }
      .touch-buttons { display: flex; gap: 16px; align-items: flex-end; padding: 0 20px 28px; }
      .touch-btn { width: 76px; height: 76px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 14px; color: #111; border: 3px solid #000; box-shadow: 0 4px 0 #000; }
      .touch-btn.bomb { background: var(--accent); font-size: 30px; width: 92px; height: 92px; }
      .touch-btn.action { background: #e8e8f4; margin-bottom: 40px; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="ui"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
