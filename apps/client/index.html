<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#14142b" />
    <meta name="description" content="Batalha de bombas multiplayer no navegador, até 5 jogadores." />
    <link rel="icon" type="image/png" href="/icons/favicon-64.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>Bombtop</title>
    <style>
      :root {
        --bg: #14142b;
        --bg2: #1f1f45;
        --panel: #2a2a5c;
        --panel-hi: #34346e;
        --ink: #0b0b16;
        --text: #f7f7ff;
        --muted: #b4b4dc;
        --accent: #ffd23f;
        --fire: #ff7a1a;
        --danger: #ff6b6b;
        --display: "Lilita One", system-ui, sans-serif;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; overflow: hidden; color: var(--text); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
      body {
        background:
          radial-gradient(ellipse at 20% 0%, #3b2a6e88, transparent 55%),
          radial-gradient(ellipse at 100% 100%, #ff7a1a22, transparent 50%),
          repeating-linear-gradient(0deg, #ffffff06 0 1px, transparent 1px 48px),
          repeating-linear-gradient(90deg, #ffffff06 0 1px, transparent 1px 48px),
          linear-gradient(160deg, var(--bg2), var(--bg));
        -webkit-tap-highlight-color: transparent;
      }
      #app { width: 100%; height: 100%; display: grid; place-items: center; }
      #ui { position: fixed; inset: 0; display: grid; place-items: center; pointer-events: none; z-index: 2;
        padding: max(12px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
      [hidden] { display: none !important; }

      /* Shared pieces */
      .screen { pointer-events: auto; width: min(920px, 100%); max-height: 100%; overflow: auto; display: grid; gap: 16px; align-items: center; scrollbar-width: none; padding: 14px 4px 10px; }
      .card { background: linear-gradient(180deg, var(--panel-hi), var(--panel)); border: 3px solid var(--ink); box-shadow: 0 6px 0 var(--ink), inset 0 2px 0 #ffffff22; border-radius: 18px; padding: 16px; display: grid; gap: 10px; }
      .row { display: flex; gap: 8px; align-items: stretch; }
      .row > input { flex: 1; min-width: 0; width: 0; }
      input, button { font: inherit; font-size: 16px; border-radius: 12px; border: 3px solid var(--ink); padding: 10px 14px; min-height: 46px; }
      input { background: #fff; color: #15152a; font-weight: 600; }
      input::placeholder { color: #8a8aa8; font-weight: 500; }
      input:focus { outline: 3px solid var(--accent); outline-offset: 1px; }
      button { background: #e9e9fb; color: #15152a; cursor: pointer; font-family: var(--display); font-size: 18px; letter-spacing: 0.3px; box-shadow: 0 4px 0 var(--ink); transition: transform 0.06s, box-shadow 0.06s; }
      button:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
      button.primary { background: linear-gradient(180deg, #ffe066, var(--accent)); }
      button.big { font-size: 22px; min-height: 54px; }
      button.ghost { background: transparent; color: var(--muted); border-color: #ffffff33; box-shadow: none; }
      button:disabled { opacity: 0.45; cursor: default; }
      .error { color: var(--danger); margin: 0; font-size: 14px; text-align: center; }
      .error:empty, .invite:empty, .status:empty { display: none; }
      .status { color: var(--accent); margin: 0; font-size: 14px; font-weight: 700; text-align: center; display: flex; gap: 8px; align-items: center; justify-content: center; }
      .status::before { content: ""; flex: none; width: 14px; height: 14px; border-radius: 50%; border: 3px solid currentColor; border-right-color: transparent; animation: spin 0.8s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      .invite { color: var(--accent); margin: 0; text-align: center; font-weight: 700; }
      .hint { color: var(--muted); font-size: 13px; margin: 0; text-align: center; }
      .mascot { display: inline-block; line-height: 0; }
      .mascot svg { width: 100%; height: 100%; overflow: visible; }
      .spark { transform-origin: 86px 12px; animation: spark 0.35s steps(2) infinite alternate; }
      @keyframes spark { from { transform: scale(0.85) rotate(-8deg); } to { transform: scale(1.15) rotate(8deg); } }
      @keyframes bob { 0%, 100% { transform: translateY(0) rotate(-3deg); } 50% { transform: translateY(-8px) rotate(3deg); } }
      .eyes { transform-box: fill-box; transform-origin: center; animation: blink 4.2s infinite; }
      @keyframes blink { 0%, 93%, 100% { transform: scaleY(1); } 95% { transform: scaleY(0.1); } }
      .pupil { animation: look 5s steps(1) infinite; }
      @keyframes look {
        0% { transform: translate(0, 0); }
        22% { transform: translate(-4px, 0); }
        40% { transform: translate(-4px, -2px); }
        58% { transform: translate(1px, 1px); }
        78% { transform: translate(-2px, 2px); }
      }
      /* Lobby: each mascot strolls back and forth in its seat, legs swinging, and now and then jumps. */
      .seat .mascot { animation: stroll 6s linear infinite; }
      .seat .mascot svg { transform-origin: 50% 100%; animation: jump 3.2s ease-out infinite; }
      .seat .body { transform-box: fill-box; transform-origin: center bottom; animation: waddle 0.36s ease-in-out infinite alternate; }
      .seat .leg { transform-box: fill-box; transform-origin: center top; animation: swing 0.36s ease-in-out infinite alternate; }
      .seat .leg.right { animation-direction: alternate-reverse; }
      .seat:nth-child(2) .mascot, .seat:nth-child(2) .mascot svg, .seat:nth-child(2) .eyes, .seat:nth-child(2) .pupil { animation-delay: -1.7s; }
      .seat:nth-child(3) .mascot, .seat:nth-child(3) .mascot svg, .seat:nth-child(3) .eyes, .seat:nth-child(3) .pupil { animation-delay: -3.1s; }
      .seat:nth-child(4) .mascot, .seat:nth-child(4) .mascot svg, .seat:nth-child(4) .eyes, .seat:nth-child(4) .pupil { animation-delay: -4.4s; }
      .seat:nth-child(5) .mascot, .seat:nth-child(5) .mascot svg, .seat:nth-child(5) .eyes, .seat:nth-child(5) .pupil { animation-delay: -0.8s; }
      /* Each bot level has its own personality. Fácil: a sleepy one that sways in place and dozes off. */
      .seat.easy .mascot { animation: none; }
      .seat.easy .mascot svg { animation: sway 3.6s ease-in-out infinite; }
      .seat.easy .body { animation: breathe 1.8s ease-in-out infinite alternate; }
      .seat.easy .leg { animation: dangle 1.8s ease-in-out infinite alternate; }
      .seat.easy .eyes { animation: doze 6s ease-in-out infinite; }
      .seat.easy::after { content: "z"; position: absolute; top: 12px; left: 62%; font-family: var(--display); font-size: 16px; color: var(--muted); animation: zzz 2.4s ease-out infinite; pointer-events: none; }
      @keyframes sway { 0%, 100% { transform: rotate(-6deg); } 50% { transform: rotate(6deg); } }
      @keyframes breathe { from { transform: scale(1, 1); } to { transform: scale(1.05, 0.95); } }
      @keyframes dangle { from { transform: rotate(-8deg); } to { transform: rotate(8deg); } }
      @keyframes doze { 0%, 30%, 100% { transform: scaleY(1); } 40%, 80% { transform: scaleY(0.25); } }
      @keyframes zzz { from { transform: translate(0, 0) scale(0.6); opacity: 0; } 30% { opacity: 1; } to { transform: translate(14px, -18px) scale(1.2); opacity: 0; } }
      /* Médio: a springy one that pogo-hops while it wanders, legs kicking out in the air. */
      .seat.medium .mascot { animation-duration: 9s; }
      .seat.medium .mascot svg { animation: pogo 0.8s cubic-bezier(0.3, 0, 0.3, 1) infinite; }
      .seat.medium .body { animation: none; }
      .seat.medium .leg.left { animation: kick-left 0.8s ease-in-out infinite; }
      .seat.medium .leg.right { animation: kick-right 0.8s ease-in-out infinite; }
      @keyframes pogo {
        0%, 100% { transform: translateY(0) scale(1.14, 0.86); }
        18% { transform: translateY(-4px) scale(0.96, 1.06); }
        50% { transform: translateY(-20px) scale(0.94, 1.08); }
        82% { transform: translateY(-2px) scale(1, 1); }
      }
      @keyframes kick-left { 0%, 20%, 80%, 100% { transform: rotate(0); } 50% { transform: rotate(28deg); } }
      @keyframes kick-right { 0%, 20%, 80%, 100% { transform: rotate(0); } 50% { transform: rotate(-28deg); } }
      /* Difícil: a wired one that dashes side to side, glowing, and backflips at each end. */
      .seat.hard .mascot { animation: dash 3s cubic-bezier(0.7, 0, 0.3, 1) infinite; filter: drop-shadow(0 0 6px #ff5a3c99); }
      .seat.hard .mascot svg { transform-origin: 50% 60%; animation: flip 3s ease-in-out infinite; }
      .seat.hard .body, .seat.hard .leg { animation-duration: 0.16s; }
      .seat.hard .spark { animation-duration: 0.12s; }
      @keyframes dash {
        0%, 12% { transform: translateX(-16px) scaleX(1); }
        38%, 49.9% { transform: translateX(16px) scaleX(1); }
        50%, 62% { transform: translateX(16px) scaleX(-1); }
        88%, 99.9% { transform: translateX(-16px) scaleX(-1); }
        100% { transform: translateX(-16px) scaleX(1); }
      }
      @keyframes flip {
        0%, 38%, 50%, 88%, 100% { transform: translateY(0) rotate(0) scale(1, 1); }
        40%, 90% { transform: translateY(0) rotate(0) scale(1.15, 0.85); }
        44%, 94% { transform: translateY(-26px) rotate(-180deg) scale(0.95, 1.05); }
        48%, 98% { transform: translateY(0) rotate(-360deg) scale(1.1, 0.9); }
      }
      .seat.empty *, .seat.away .mascot, .seat.away .mascot * { animation: none; }
      @keyframes stroll {
        0% { transform: translateX(-12px); }
        35%, 49.9% { transform: translateX(12px); }
        50% { transform: translateX(12px) scaleX(-1); }
        85%, 99.9% { transform: translateX(-12px) scaleX(-1); }
        100% { transform: translateX(-12px); }
      }
      @keyframes waddle { from { transform: translateY(0) rotate(-5deg); } to { transform: translateY(-5px) rotate(5deg); } }
      @keyframes swing { from { transform: rotate(-22deg); } to { transform: rotate(22deg); } }
      @keyframes jump {
        0%, 70%, 100% { transform: translateY(0) scale(1, 1); }
        74% { transform: translateY(0) scale(1.15, 0.85); }
        82% { transform: translateY(-22px) scale(0.9, 1.12); }
        90% { transform: translateY(0) scale(1.15, 0.85); }
        95% { transform: translateY(0) scale(1, 1); }
      }
      @keyframes pop { from { transform: scale(0.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }

      /* Menu: a title screen. Light rays turn behind the cast and the logo, embers drift up, the play button glows.
         Phones upright stack the hero over the card; wider screens put them side by side. */
      .menu { grid-template-columns: minmax(0, 1fr); justify-items: center; align-content: safe center; gap: 14px; min-height: 100%; } /* the full height, so the rays fade out before its clipped edges */
      .menu-bg { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none;
        background: radial-gradient(ellipse 70% 50% at 50% 110%, #ff7a1a33, transparent 70%), radial-gradient(ellipse 60% 60% at 50% 0%, #6a3fc044, transparent 70%); }
      .menu-bg i { position: absolute; bottom: -12px; left: var(--x); width: 6px; height: 6px; border-radius: 1px; background: #ffd23f; box-shadow: 0 0 8px #ff7a1a; transform: rotate(45deg); opacity: 0; animation: ember var(--t) linear var(--d) infinite; }
      .menu-bg i:nth-child(3n) { background: #ff7a1a; width: 4px; height: 4px; }
      .menu-bg i:nth-child(4n) { background: #fff3b0; }
      @keyframes ember { 0% { transform: translate(0, 0) rotate(45deg); opacity: 0; } 10% { opacity: 0.9; } 70% { opacity: 0.6; } 100% { transform: translate(40px, -105vh) rotate(405deg); opacity: 0; } }

      .hero { position: relative; display: grid; justify-items: center; gap: 6px; text-align: center; isolation: isolate; }
      .hero::before { content: ""; position: absolute; z-index: -1; left: 50%; top: 34%; width: 100%; aspect-ratio: 1; translate: -50% -50%; border-radius: 50%;
        background: repeating-conic-gradient(from 0deg, #ffd23f1f 0 10deg, transparent 10deg 24deg); mask: radial-gradient(circle closest-side, #000 25%, transparent 100%); -webkit-mask: radial-gradient(circle closest-side, #000 25%, transparent 100%); animation: spin 40s linear infinite; }
      .hero::after { content: ""; position: absolute; z-index: -1; left: 50%; top: 34%; width: 70%; aspect-ratio: 1; translate: -50% -50%; border-radius: 50%; background: radial-gradient(circle, #ffb34755, transparent 65%); }
      .cast { display: flex; align-items: flex-end; justify-content: center; position: relative; padding-bottom: 6px; }
      .cast::after { content: ""; position: absolute; left: 6%; right: 6%; bottom: 0; height: 18px; border-radius: 50%; background: radial-gradient(ellipse, #000a, transparent 70%); z-index: -1; }
      .cast-member { display: block; line-height: 0; }
      .cast .mascot.sheet { display: block; position: relative; width: 70px; height: 76px; --k: 2.8; }
      .cast .far .mascot.sheet { width: 54px; height: 60px; --k: 2.1; filter: brightness(0.85); }
      .cast .star .mascot.sheet { width: 120px; height: 118px; --k: 4.6; filter: drop-shadow(0 6px 0 #0006); }
      .cast .star .title-bomber { --fly-cell: 118px; position: relative; display: block; width: 120px; height: 118px; filter: drop-shadow(0 6px 0 #0006); }
      .cast .star .title-bomber i { position: absolute; left: 50%; bottom: 0; width: var(--fly-cell); height: var(--fly-cell); translate: -50% 0; background: url("/sprites/bomber-title-fly.png") no-repeat 0 0 / calc(var(--fly-cell) * 4) calc(var(--fly-cell) * 2); image-rendering: auto; animation: title-bomber-fly 1.12s steps(1) infinite; }
      @keyframes title-bomber-fly {
        0%, 12.49% { background-position: 0 0; }
        12.5%, 24.99% { background-position: calc(var(--fly-cell) * -1) 0; }
        25%, 37.49% { background-position: calc(var(--fly-cell) * -2) 0; }
        37.5%, 49.99% { background-position: calc(var(--fly-cell) * -3) 0; }
        50%, 62.49% { background-position: 0 calc(var(--fly-cell) * -1); }
        62.5%, 74.99% { background-position: calc(var(--fly-cell) * -1) calc(var(--fly-cell) * -1); }
        75%, 87.49% { background-position: calc(var(--fly-cell) * -2) calc(var(--fly-cell) * -1); }
        87.5%, 100% { background-position: calc(var(--fly-cell) * -3) calc(var(--fly-cell) * -1); }
      }
      .cast .near { margin-inline: -10px; }
      .cast .far.left { margin-right: -6px; } .cast .far.right { margin-left: -6px; }
      .cast .edge .mascot.sheet { width: 46px; height: 52px; --k: 1.8; filter: brightness(0.72); }
      /* Naruto at the left edge, the spider at the right one */
      .cast .edge.left { margin-right: -8px; } .cast .edge.right { margin-left: -8px; }
      @media (max-width: 400px) { .cast .edge { display: none; } }
      .cast .star { z-index: 1; animation: bob 2.4s ease-in-out infinite; }
      .logo { margin: 0; font-family: var(--display); font-weight: 400; font-size: clamp(54px, 15vw, 76px); line-height: 0.9; color: var(--accent); letter-spacing: 2px; -webkit-text-stroke: 4px var(--ink); paint-order: stroke fill; rotate: -3deg;
        text-shadow: 0 6px 0 var(--ink), 0 0 28px #ffb34766; animation: logo-in 0.7s cubic-bezier(0.2, 1.7, 0.4, 1) both; }
      .logo span { color: var(--fire); }
      @keyframes logo-in { from { scale: 0.4; opacity: 0; } to { scale: 1; opacity: 1; } }
      .tagline { margin: 6px 0 0; color: var(--text); font-size: 16px; font-weight: 700; text-shadow: 0 2px 0 #0008; }
      .perks { list-style: none; margin: 4px 0 0; padding: 0; display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; max-width: 420px; }
      .perks li { font-size: 12px; font-weight: 800; color: var(--text); background: #ffffff14; border: 2px solid #ffffff22; border-radius: 999px; padding: 4px 10px; }
      .perks li::before { content: "★ " / ""; color: var(--accent); }

      .menu .card { width: min(400px, 100%); position: relative; border-color: var(--ink); box-shadow: 0 6px 0 var(--ink), 0 0 0 1px #ffffff10, 0 18px 40px #0008, inset 0 2px 0 #ffffff22; }
      .card-title { margin: 0 0 2px; font-family: var(--display); font-weight: 400; font-size: 24px; text-align: center; color: var(--text); }
      button.play { font-size: 26px; min-height: 62px; position: relative; overflow: hidden; background: linear-gradient(180deg, #fff07a, var(--accent) 55%, #ffb627); }
      button.play:not(:disabled) { animation: play-glow 1.8s ease-in-out infinite; }
      button.play::after { content: ""; position: absolute; top: 0; bottom: 0; left: -40%; width: 30%; background: linear-gradient(90deg, transparent, #ffffffaa, transparent); transform: skewX(-20deg); animation: shine 3.2s ease-in-out infinite; }
      @keyframes play-glow { 50% { box-shadow: 0 4px 0 var(--ink), 0 0 0 5px #ffd23f40, 0 0 26px #ffd23f66; } }
      @keyframes shine { 0%, 60% { left: -40%; } 100% { left: 130%; } }
      button.create { background: linear-gradient(180deg, #9fe3ff, #5fb8f5); }
      .account { display: flex; gap: 8px; align-items: center; justify-content: space-between; font-size: 14px; color: var(--muted); }
      .account:empty { display: none; }
      .account > button { min-height: 38px; font-size: 15px; padding: 6px 12px; }
      .account > button:only-child { flex: 1; }
      .menu-foot { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 4px 12px; font-size: 11px; color: var(--muted); opacity: 0.7; }
      button.link { min-height: 0; padding: 0; border: 0; box-shadow: none; background: none; color: inherit; font: inherit; font-size: 11px; text-decoration: underline; cursor: pointer; }
      button.link:active:not(:disabled) { transform: none; box-shadow: none; }

      /* Tablets upright: more room, bigger hero */
      @media (min-width: 600px) and (min-height: 800px) {
        .cast .mascot.sheet { width: 100px; height: 110px; --k: 4; }
        .cast .far .mascot.sheet { width: 78px; height: 86px; --k: 3; }
        .cast .edge .mascot.sheet { width: 66px; height: 74px; --k: 2.6; }
        .cast .star .mascot.sheet { width: 170px; height: 168px; --k: 6.6; }
        .cast .star .title-bomber { --fly-cell: 168px; width: 170px; height: 168px; }
        .logo { font-size: 104px; }
        .tagline { font-size: 19px; }
        .perks { max-width: 620px; }
        .perks li { font-size: 14px; padding: 5px 12px; }
        .menu .card { width: min(460px, 100%); padding: 20px; gap: 12px; }
      }
      .guide h2 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 26px; text-align: center; }
      .guide-body { display: grid; gap: 14px; }
      .guide-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(78px, 1fr)); gap: 8px; align-content: start; }
      .guide-card { display: grid; justify-items: center; gap: 4px; padding: 8px 4px; min-height: 0; font-family: inherit; font-size: 12px; font-weight: 700; line-height: 1.15; background: #00000030; color: var(--text); border-color: #ffffff22; box-shadow: none; }
      .guide-card.on { border-color: var(--accent); background: #ffffff1a; }
      .guide-detail { display: grid; gap: 10px; align-content: start; order: -1; }
      .guide-stage { border: 3px solid var(--ink); border-radius: 14px; overflow: hidden; line-height: 0; background: #2f6b3a; box-shadow: 0 4px 0 var(--ink); min-height: 60px; }
      .guide-stage canvas { display: block; width: 100%; }
      .guide-head { display: flex; align-items: center; gap: 12px; }
      .guide-head h3 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 24px; }
      .guide-text { margin: 0; line-height: 1.4; }
      .guide-tips-title { font-family: var(--display); font-weight: 400; font-size: 16px; color: var(--accent); }
      .guide-tips { margin: 0; padding-left: 20px; color: var(--muted); display: grid; gap: 4px; line-height: 1.35; }
      .guide-icon { --px: 40px; flex: none; width: var(--px); height: var(--px); background-size: calc(var(--px) * var(--cols)) calc(var(--px) * var(--rows)); background-position: calc(var(--cell) * var(--px) * -1) 0; }
      .guide-icon.big { --px: 56px; }
      /* Character guide: same frame as the item guide, with a portrait, the special, voice lines and every animation */
      /* A guide taller than the screen scrolls from its top (centering would push the top out of reach) */
      .screen.menu.guiding { align-content: safe center; }
      /* Characters: the picker stays on top (the detail is long), compact */
      .chars-list { grid-template-columns: repeat(3, 1fr); order: -2; }
      .chars-list .guide-card { padding: 6px 4px; }
      .chars-list .mascot.sheet { width: 56px; height: 58px; --k: 2.2; }
      .chars-head { gap: 14px; }
      .chars-head h3 { line-height: 1; }
      .chars-title { margin: 2px 0 0; color: var(--accent); font-weight: 700; font-size: 14px; }
      .chars-portrait { flex: none; width: 92px; height: 96px; display: grid; place-items: end center; border-radius: 14px; background: radial-gradient(circle at 50% 70%, #ffd23f33, transparent 70%); }
      .chars-portrait .mascot.sheet { width: 100%; height: 100%; --k: 3.6; }
      .chars-special { display: grid; gap: 6px; padding: 10px 12px; border-radius: 12px; background: #00000030; border: 2px solid #ffffff1a; }
      .chars-special-head { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
      .chars-special-head strong { font-family: var(--display); font-weight: 400; font-size: 18px; }
      .chars-voices { display: flex; flex-wrap: wrap; gap: 6px; }
      .chars-voices button { min-height: 36px; padding: 4px 12px; font-size: 15px; }
      .chars-moves { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 8px; }
      .chars-move { margin: 0; display: grid; justify-items: center; gap: 4px; padding: 6px 4px; border-radius: 12px; background: #00000030; border: 2px solid #ffffff14; }
      .chars-move .mascot.sheet { width: 72px; height: 76px; --k: 2.8; }
      .chars-move figcaption { font-size: 12px; font-weight: 700; color: var(--muted); text-align: center; line-height: 1.15; }
      .or { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 1px; }
      .or::before, .or::after { content: ""; flex: 1; border-top: 2px dashed #ffffff22; }

        button.ghost:hover:not(:disabled):not(:active) { background: #ffffff14; color: var(--text); border-color: #ffffff66; box-shadow: none; filter: none; }
        button.link:hover:not(:disabled):not(:active) { transform: none; box-shadow: none; filter: none; color: var(--accent); }
        button.mini:hover:not(:disabled):not(:active) { transform: translateY(-1px); box-shadow: 0 3px 0 var(--ink); }
        button.kick-bot:hover:not(:active) { background: var(--danger); color: #fff; box-shadow: none; transform: scale(1.1); }
        button.mute:hover:not(:active) { background: #fff; transform: scale(1.06); box-shadow: 0 4px 0 var(--ink); }
        .guide-card:hover:not(:active):not(.on) { background: #ffffff14; border-color: #ffffff55; box-shadow: none; transform: translateY(-2px); filter: none; }
        .guide-card.on:hover { transform: none; box-shadow: none; filter: none; }
        input:hover:not(:focus) { border-color: #2a2a5c; box-shadow: 0 0 0 3px #ffd23f33; }
        .code-box:hover { border-color: #ffd23f88; }
        .seat:not(.empty):hover { border-color: color-mix(in srgb, var(--p) 60%, var(--ink)); }
        .seat.me:hover { border-color: var(--accent); }
        .seat.empty:hover { border-color: #ffffff55; background: #0b0b1688; }
      }
      /* Keyboard: a clear ring on whatever has focus */
      button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
      /* Sound toggle */
      .extras > button { flex: 1; }
      /* Title intro: name cards over the arena, then the logo; buttons in the bottom corner */
      .intro { position: fixed; inset: 0; z-index: 2; pointer-events: none; }
      .intro [hidden] { display: none !important; }
      .intro-card { position: absolute; left: 50%; bottom: max(18px, 12vh, env(safe-area-inset-bottom)); translate: -50% 0; width: min(90vw, 460px); text-align: center; background: linear-gradient(180deg, var(--panel-hi), var(--panel)); border: 3px solid var(--ink); box-shadow: 0 6px 0 var(--ink); border-radius: 18px; padding: 10px 18px 12px; display: grid; gap: 2px; }
      .intro-card.in { animation: intro-card 0.45s cubic-bezier(0.2, 1.4, 0.4, 1) both; }
      @keyframes intro-card { from { transform: translateY(40px) scale(0.85); opacity: 0; } to { transform: none; opacity: 1; } }
      .intro-name { font-family: var(--display); font-weight: 400; font-size: clamp(28px, 7vw, 44px); line-height: 1; color: var(--accent); -webkit-text-stroke: 3px var(--ink); paint-order: stroke fill; }
      .intro-line { font-size: clamp(14px, 3.6vw, 18px); font-weight: 600; }
      .intro-logo { position: absolute; inset: 0; display: grid; place-items: center; background: radial-gradient(circle, #ffd23f33, transparent 60%); animation: fade-in 0.3s both; }
      .intro-logo .logo { font-size: clamp(64px, 18vw, 150px); animation: title-in 0.5s cubic-bezier(0.2, 1.4, 0.4, 1) both; }
      .intro-actions { position: absolute; top: max(10px, env(safe-area-inset-top)); left: max(10px, env(safe-area-inset-left)); display: flex; gap: 8px; pointer-events: auto; }
      .intro-actions button { font-size: 15px; min-height: 40px; padding: 6px 14px; }
      @media (max-height: 480px) { .intro-card { bottom: max(10px, env(safe-area-inset-bottom)); padding: 6px 14px 8px; } .intro-name { font-size: 26px; } .intro-line { font-size: 14px; } }
      @media (prefers-reduced-motion: reduce) { .intro-card.in, .intro-logo, .intro-logo .logo { animation: none; } }
      .demo-leave { position: fixed; top: max(10px, env(safe-area-inset-top)); left: max(10px, env(safe-area-inset-left)); z-index: 3; font-size: 15px; min-height: 40px; padding: 6px 14px; }
      .sound { position: fixed; top: max(10px, env(safe-area-inset-top)); right: max(10px, env(safe-area-inset-right)); z-index: 3; display: grid; justify-items: end; gap: 8px; }
      .sound-panel { background: linear-gradient(180deg, var(--panel-hi), var(--panel)); border: 3px solid var(--ink); box-shadow: 0 4px 0 var(--ink); border-radius: 14px; padding: 10px 12px; display: grid; gap: 8px; width: 200px; }
      .sound-panel span { font-family: var(--display); font-size: 15px; }
      .sound-panel input[type="range"] { width: 100%; min-height: 0; padding: 0; border: 0; accent-color: var(--accent); background: transparent; }
      .sound-panel button { font-size: 15px; min-height: 38px; padding: 6px 10px; }
      .mute { width: 44px; height: 44px; min-height: 0; padding: 0; border-radius: 50%; display: grid; place-items: center; background: #ffffffd9; }
      .mute svg { width: 22px; height: 22px; }

      /* Offline pairing dialog: QR codes and the camera, over everything (the lobby too) */
      .screen.pair { position: fixed; inset: 0; z-index: 4; width: auto; max-height: none; padding: max(10px, env(safe-area-inset-top)) 12px max(10px, env(safe-area-inset-bottom)); place-items: center; background: #0b0b16e6; }
      .pair-card { width: min(440px, 100%); max-height: 100%; overflow: auto; justify-items: center; text-align: center; }
      .pair-card h2 { font-family: var(--display); font-weight: 400; font-size: 24px; margin: 0; }
      .pair-hint { font-size: 14px; color: var(--muted); white-space: pre-line; margin: 0; }
      .pair-body { display: grid; gap: 10px; justify-items: center; width: 100%; }
      .pair-body > .big { width: 100%; }
      .pair-qr { width: min(300px, 78vmin); aspect-ratio: 1; background: #fff; border-radius: 10px; padding: 6px; }
      .pair-qr svg { width: 100%; height: 100%; display: block; }
      .pair-cam { width: min(240px, 60vmin); aspect-ratio: 4 / 3; object-fit: cover; border-radius: 10px; border: 3px solid var(--ink); background: #000; }
      .pair-paste { width: 100%; font-size: 14px; }
      .pair-slot { font-size: 14px; color: var(--muted); }
      .offline-btn { width: 100%; }
      @media (orientation: landscape) and (max-height: 500px) {
        .pair-card { width: min(720px, 100%); padding: 10px 14px; gap: 6px; }
        .pair-card h2 { font-size: 19px; }
        .pair-hint { font-size: 13px; }
        /* QR on the left, everything else stacked beside it */
        .pair-body:has(.pair-qr) { grid-template-columns: auto 1fr; align-items: center; column-gap: 14px; }
        .pair-body:has(.pair-qr) > .pair-qr { grid-row: span 3; align-self: center; width: min(220px, calc(100vh - 170px)); }
        .pair-cam { width: min(200px, 34vh); }
      }

      /* In-match menu (☰, top left): touch controls and leaving */
      .match-menu { position: fixed; top: max(10px, env(safe-area-inset-top)); left: max(10px, env(safe-area-inset-left)); z-index: 3; display: grid; justify-items: start; gap: 8px; }
      body:has(.lobby:not([hidden])) .match-menu { display: none; }
      .match-menu-btn { width: 44px; height: 44px; min-height: 0; padding: 0; border-radius: 50%; font-size: 22px; line-height: 1; background: #ffffffd9; }
      .match-panel { background: linear-gradient(180deg, var(--panel-hi), var(--panel)); border: 3px solid var(--ink); box-shadow: 0 4px 0 var(--ink); border-radius: 14px; padding: 10px 12px; display: grid; gap: 8px; width: 210px; }
      .match-panel span { font-family: var(--display); font-size: 15px; }
      .match-panel button { font-size: 15px; min-height: 38px; padding: 6px 10px; }
      .match-leave { background: #ff7a6b; }
      .match-leave.sure { background: #e84a4a; color: #fff; }

      /* Touch controls */
      .touch { position: fixed; inset: 0; z-index: 1; display: flex; touch-action: none; user-select: none; -webkit-user-select: none; }
      body:has(.lobby:not([hidden])) .touch { display: none; } /* nothing to steer in the lobby */
      .stick-zone { flex: 1; position: relative; }
      /* D-pad: a cross of four arrows; the whole square is touchable (corners steer diagonally) */
      .dpad { position: absolute; left: max(20px, env(safe-area-inset-left)); bottom: 24px; width: 156px; height: 156px; }
      .dpad::before { content: ""; position: absolute; inset: 52px; background: #e8e8f4cc; border: 3px solid #000; border-radius: 8px; }
      .dpad-arrow { position: absolute; width: 52px; height: 52px; display: grid; place-items: center; background: #e8e8f4cc; border: 3px solid #000; border-radius: 12px; box-shadow: 0 4px 0 #000; }
      .dpad-arrow::after { content: ""; border: 11px solid transparent; }
      .dpad-arrow.up { left: 52px; top: 0; } .dpad-arrow.up::after { border-bottom: 14px solid #111; border-top-width: 0; }
      .dpad-arrow.down { left: 52px; bottom: 0; } .dpad-arrow.down::after { border-top: 14px solid #111; border-bottom-width: 0; }
      .dpad-arrow.left { left: 0; top: 52px; } .dpad-arrow.left::after { border-right: 14px solid #111; border-left-width: 0; }
      .dpad-arrow.right { right: 0; top: 52px; } .dpad-arrow.right::after { border-left: 14px solid #111; border-right-width: 0; }
      .knob { position: fixed; width: 56px; height: 56px; margin: -28px 0 0 -28px; border-radius: 50%; background: #ffffff55; border: 3px solid #ffffffaa; pointer-events: none; }
      .touch.stick .dpad { display: none; }
      .dpad-arrow.on { background: var(--accent); transform: translateY(3px); box-shadow: 0 1px 0 #000; }
      /* Special right above the bomb button (the thumb's home), action to its left */
      .touch-buttons { align-self: flex-end; display: grid; grid-template-areas: ". special" "action bomb"; gap: 12px 16px; align-items: end; justify-items: center; padding: 0 20px 28px; }
      .touch-btn { width: 76px; height: 76px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 14px; color: #111; border: 3px solid #000; box-shadow: 0 4px 0 #000; }
      .touch-btn.bomb { grid-area: bomb; background: var(--accent); font-size: 30px; width: 92px; height: 92px; }
      .touch-btn.action { grid-area: action; background: #e8e8f4; margin-bottom: 40px; }
      .touch-btn.special { grid-area: special; background: #9fe3ff; font-size: 28px; width: 64px; height: 64px; }
      /* Phones upright: arena up top under the corner buttons, the buttons in one column clear of the d-pad */
      @media (orientation: portrait) and (max-width: 600px) {
        body:has(.touch:not([hidden])) #app { place-items: start center; padding-top: calc(max(10px, env(safe-area-inset-top)) + 58px); }
        .touch-buttons { grid-template-areas: "special" "action" "bomb"; gap: 10px; }
        .touch-btn.action { margin-bottom: 0; }
      }
      @media (orientation: portrait) and (max-width: 600px) and (max-height: 700px) {
        .touch-buttons { gap: 8px; }
        .touch-btn.bomb { width: 84px; height: 84px; }
        .touch-btn.action { width: 68px; height: 68px; }
        .touch-btn.special { width: 56px; height: 56px; font-size: 24px; }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="ui"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
